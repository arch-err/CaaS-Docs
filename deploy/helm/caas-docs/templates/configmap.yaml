apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caas-docs.fullname" . }}-nginx
  labels:
    {{- include "caas-docs.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /git/root/site;
      index index.html;

      access_log /dev/stdout;
      error_log /dev/stderr warn;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
      }

      location /pagefind/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
      }

      location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri/index.html =404;
      }
    }


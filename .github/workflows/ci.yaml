name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Validate documentation and build site
        run: bun run check

      - name: Lint Helm chart
        run: helm lint deploy/helm/caas-docs

  publish:
    name: Publish deploy branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Build static site
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Add build metadata
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_REVISION" > dist/source-revision.txt
          printf '{"sourceRevision":"%s","builtAt":"%s"}\n' \
            "$SOURCE_REVISION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/version.json

      - name: Publish generated branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
        working-directory: dist
        run: |
          git init --initial-branch=deploy
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "deploy: $SOURCE_REVISION"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:deploy
